name: DCInside Overseas Stock Summary

on:
  schedule:
    # GitHub Actions cron is UTC; 22-14 UTC = 07:00-23:00 KST.
    - cron: "0 0-14,22-23 * * *"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore seen-post state
        uses: actions/cache/restore@v4
        with:
          path: dcinside-seen.json
          key: dcinside-seen-${{ github.run_id }}
          restore-keys: dcinside-seen-

      - name: Run summary collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dcinside_summary.py

      - name: Save seen-post state
        uses: actions/cache/save@v4
        with:
          path: dcinside-seen.json
          key: dcinside-seen-${{ github.run_id }}
