name: DCInside Overseas Stock Summary

on:
  schedule:
    # GitHub Actions cron is UTC; 22:30 UTC(전날) = 07:30 KST, 하루 1회 실행.
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore seen-post state
        uses: actions/cache/restore@v4
        with:
          path: dcinside-seen.json
          key: dcinside-seen-${{ github.run_id }}
          restore-keys: dcinside-seen-

      - name: Run summary collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dcinside_summary.py

      - name: Save seen-post state
        uses: actions/cache/save@v4
        with:
          path: dcinside-seen.json
          key: dcinside-seen-${{ github.run_id }}
